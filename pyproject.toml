[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-sieve"
version = "0.0.1"
description = "Measured, reversible, backend-agnostic context pruning for LangChain/LangGraph agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Emrecan Gök" }]
dependencies = ["langchain-core>=1.0"]

[project.optional-dependencies]
openai = ["openai>=3.26"]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/ctxsieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
