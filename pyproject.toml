[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-sieve"
version = "0.0.1"
description = "Measured, reversible, backend-agnostic context pruning for LangChain/LangGraph agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Emrecan Gök" }]
dependencies = ["langchain-core>=1.0"]

[project.optional-dependencies]
openai = ["openai>=3.26"]
langgraph = ["langgraph>=1.0"]
langchain = ["langchain>=1.0", "langgraph>=1.0"]
dev = ["pytest>=8", "hypothesis>=6", "langgraph>=1.0", "langchain>=1.0"]
# Benchmark agent and corpus tooling (bench/). langchain-community is sunset upstream; it is
# only used to refresh the docs snapshot with WebBaseLoader.
bench = [
    "openai>=3.26",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=1.7",
    "langchain-text-splitters>=1.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "langchain-community>=0.4",
    "beautifulsoup4>=4.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ctxsieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
