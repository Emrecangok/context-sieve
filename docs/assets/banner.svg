<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="context-sieve: decide what stays in your agent's context">
  <title>context-sieve: decide what stays in your agent's context</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0F2427" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowLogo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGraph" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0F766E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
      .flow { fill: none; stroke: #2DD4BF; stroke-width: 1.6; stroke-dasharray: 5 6; stroke-opacity: .85;
              animation: dash 1.1s linear infinite; }
      .flow-amber { fill: none; stroke: #F5B342; stroke-width: 1.6; stroke-dasharray: 5 6; stroke-opacity: .85;
              animation: dash 1.3s linear infinite; }
      .flow-grey { fill: none; stroke: #789998; stroke-width: 1.6; stroke-dasharray: 5 6; stroke-opacity: .85;
              animation: dash 1.5s linear infinite; }
      .node { fill: #0A1A1C; stroke: #21393C; stroke-width: 1.2; }
      .node-hl { fill: #0A1A1C; stroke: #2DD4BF; stroke-width: 1.4; }
      .chip { fill: #0D1F22; stroke: #21393C; stroke-width: 1; }
      .chip-out { fill: #0D1F22; stroke: #F5B342; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .n-title { fill: #E4F5F4; font-size: 14px; font-weight: 600; }
      .n-sub { fill: #2DD4BF; font-size: 12px; }
      .n-sub-muted { fill: #789998; font-size: 12px; }
      .chip-t { fill: #C3DADA; font-size: 12px; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .leave { animation: leave 3.2s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -22; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      @keyframes leave { 0% { transform: translateX(150px); opacity: 0; } 25%, 75% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(0); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow, .flow-amber, .flow-grey, .pulse, .leave { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <!-- background -->
    <rect width="1200" height="420" fill="#061214"/>
    <rect width="1200" height="420" fill="url(#grid)" opacity=".7"/>
    <circle cx="110" cy="110" r="150" fill="url(#glowLogo)"/>
    <circle cx="860" cy="220" r="300" fill="url(#glowGraph)"/>

    <!-- logo: a sieve -->
    <g transform="translate(70 70)">
      <rect width="80" height="80" rx="20" fill="url(#logoFill)"/>
      <g fill="#061214" opacity=".85">
        <circle cx="22" cy="24" r="5"/><circle cx="40" cy="24" r="5"/><circle cx="58" cy="24" r="5"/>
        <circle cx="31" cy="40" r="5"/><circle cx="49" cy="40" r="5"/>
        <circle cx="40" cy="56" r="5"/>
      </g>
      <circle cx="40" cy="68" r="3" fill="#EFFAF9" class="pulse"/>
    </g>

    <!-- title -->
    <text x="70" y="215" class="sans" font-size="56" font-weight="700" fill="#EFFAF9">context-sieve</text>
    <text x="72" y="258" class="sans" font-size="22" fill="#89A9A8">Decide what stays in your agent's context,</text>
    <text x="72" y="288" class="sans" font-size="22" fill="#89A9A8">one message at a time.</text>
    <text x="72" y="340" class="mono" font-size="15" fill="#2DD4BF">LangGraph hooks · create_agent middleware</text>
    <text x="72" y="366" class="mono" font-size="15" fill="#789998">OpenAI Decisions API · view &amp; state modes · fail-open</text>

    <!-- recent window -->
    <rect x="780" y="44" width="380" height="104" rx="14" class="node-hl"/>
    <text x="796" y="66" class="sans n-sub">recent window · kept verbatim</text>
    <rect x="796" y="80" width="112" height="52" rx="10" class="chip"/>
    <text x="808" y="102" class="mono chip-t">user</text>
    <text x="808" y="120" class="mono n-sub-muted">"stream tokens?"</text>
    <rect x="918" y="80" width="112" height="52" rx="10" class="chip"/>
    <text x="930" y="102" class="mono chip-t">tool</text>
    <text x="930" y="120" class="mono n-sub-muted">search_docs</text>
    <rect x="1040" y="80" width="104" height="52" rx="10" class="chip"/>
    <text x="1052" y="102" class="mono chip-t">ai</text>
    <text x="1052" y="120" class="mono n-sub-muted">answer</text>

    <!-- message leaving the window -->
    <g class="leave">
      <rect x="620" y="80" width="140" height="52" rx="10" class="chip-out"/>
      <text x="634" y="102" class="mono chip-t">user · leaving</text>
      <text x="634" y="120" class="mono n-sub-muted">"I use Postgres"</text>
    </g>

    <!-- to the decider -->
    <path class="flow" d="M690 134 C690 160 690 168 690 186"/>
    <rect x="600" y="188" width="180" height="58" rx="12" class="node-hl"/>
    <circle cx="616" cy="204" r="4" fill="#2DD4BF" class="pulse"/>
    <text x="628" y="209" class="sans n-title">decider</text>
    <text x="616" y="232" class="mono n-sub">drop · pin · summarize</text>

    <!-- outcomes -->
    <path class="flow" d="M660 248 C640 272 620 280 620 300"/>
    <path class="flow-amber" d="M720 248 C760 276 820 280 840 300"/>
    <path class="flow-grey" d="M760 240 C900 250 1020 270 1060 300"/>

    <rect x="540" y="302" width="170" height="70" rx="12" class="node"/>
    <text x="556" y="328" class="sans n-title">pin</text>
    <text x="556" y="352" class="sans n-sub">kept verbatim, for good</text>

    <rect x="756" y="302" width="180" height="70" rx="12" class="node"/>
    <text x="772" y="328" class="sans n-title">summarize</text>
    <text x="772" y="352" class="sans" font-size="12" fill="#F5B342">queued for a summary</text>

    <rect x="982" y="302" width="178" height="70" rx="12" class="node"/>
    <text x="998" y="328" class="sans n-title">drop</text>
    <text x="998" y="352" class="sans n-sub-muted">archived + pointer left</text>
  </g>
</svg>
