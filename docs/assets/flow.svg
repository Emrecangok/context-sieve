<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="How context-sieve works: sliding window eviction and tool-result pruning">
  <title>How context-sieve works: sliding window eviction and tool-result pruning</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#14211C" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3DDC84"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F5B342"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7F948A"/>
    </marker>
    <clipPath id="card"><rect width="1200" height="560" rx="24"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
      .flow { fill: none; stroke: #3DDC84; stroke-width: 1.6; stroke-dasharray: 5 6; animation: dash 1.1s linear infinite; }
      .flow-amber { fill: none; stroke: #F5B342; stroke-width: 1.6; stroke-dasharray: 5 6; animation: dash 1.3s linear infinite; }
      .flow-grey { fill: none; stroke: #7F948A; stroke-width: 1.6; stroke-dasharray: 5 6; animation: dash 1.5s linear infinite; }
      .lane { fill: #0C1411; stroke: #1E2C26; stroke-width: 1; }
      .node { fill: #0F1915; stroke: #2B3D35; stroke-width: 1.2; }
      .node-hl { fill: #0F1915; stroke: #3DDC84; stroke-width: 1.4; }
      .lane-t { fill: #3DDC84; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .n-title { fill: #E8F2EC; font-size: 15px; font-weight: 600; }
      .n-sub { fill: #8FA39A; font-size: 12px; }
      .n-hl { fill: #3DDC84; font-size: 12px; }
      .n-amber { fill: #F5B342; font-size: 12px; }
      .n-grey { fill: #7F948A; font-size: 12px; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -22; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .flow, .flow-amber, .flow-grey, .pulse { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="560" fill="#0A100E"/>
    <rect width="1200" height="560" fill="url(#grid)" opacity=".7"/>

    <!-- lane 1: sliding window -->
    <rect x="24" y="24" width="1152" height="228" rx="16" class="lane"/>
    <text x="48" y="54" class="sans lane-t">SLIDING WINDOW · SlidingWindowMiddleware</text>

    <rect x="48" y="80" width="200" height="136" rx="12" class="node"/>
    <text x="64" y="108" class="sans n-title">new messages</text>
    <text x="64" y="132" class="sans n-sub">user, assistant,</text>
    <text x="64" y="150" class="sans n-sub">tool calls + results</text>
    <text x="64" y="186" class="mono n-hl">add_messages ids</text>

    <path class="flow" d="M250 148 H296" marker-end="url(#arrow)"/>

    <rect x="300" y="80" width="210" height="136" rx="12" class="node-hl"/>
    <text x="316" y="108" class="sans n-title">recent window</text>
    <text x="316" y="132" class="sans n-sub">last N messages,</text>
    <text x="316" y="150" class="sans n-sub">never changed</text>
    <text x="316" y="186" class="mono n-hl">WindowPolicy(max_messages)</text>

    <path class="flow" d="M512 148 H556" marker-end="url(#arrow)"/>

    <rect x="560" y="80" width="220" height="136" rx="12" class="node-hl"/>
    <circle cx="578" cy="103" r="4" fill="#3DDC84" class="pulse"/>
    <text x="590" y="108" class="sans n-title">decider (1 call / batch)</text>
    <text x="576" y="132" class="sans n-sub">one choice question per</text>
    <text x="576" y="150" class="sans n-sub">unit leaving the window</text>
    <text x="576" y="186" class="mono n-hl">drop · pin · summarize</text>

    <path class="flow" d="M782 110 C820 110 830 96 866 96" marker-end="url(#arrow)"/>
    <path class="flow-amber" d="M782 148 H866" marker-end="url(#arrowAmber)"/>
    <path class="flow-grey" d="M782 186 C820 186 830 200 866 200" marker-end="url(#arrowGrey)"/>

    <rect x="870" y="72" width="290" height="44" rx="10" class="node"/>
    <text x="886" y="99" class="sans n-title">pin</text>
    <text x="926" y="99" class="sans n-hl">verbatim, permanent</text>

    <rect x="870" y="126" width="290" height="44" rx="10" class="node"/>
    <text x="886" y="153" class="sans n-title">summarize</text>
    <text x="970" y="153" class="sans n-amber">queue → append-only summary</text>

    <rect x="870" y="180" width="290" height="44" rx="10" class="node"/>
    <text x="886" y="207" class="sans n-title">drop</text>
    <text x="930" y="207" class="sans n-grey">archive + one pointer note</text>

    <!-- lane 2: tool-result pruning -->
    <rect x="24" y="270" width="1152" height="200" rx="16" class="lane"/>
    <text x="48" y="300" class="sans lane-t">TOOL-RESULT PRUNING · ToolPruningMiddleware</text>

    <rect x="48" y="322" width="200" height="120" rx="12" class="node"/>
    <text x="64" y="350" class="sans n-title">older tool result</text>
    <text x="64" y="374" class="sans n-sub">outside the last</text>
    <text x="64" y="392" class="sans n-sub">preserve_recent messages</text>
    <text x="64" y="424" class="mono n-hl">asked once, cached</text>

    <path class="flow" d="M250 382 H296" marker-end="url(#arrow)"/>

    <rect x="300" y="322" width="480" height="120" rx="12" class="node-hl"/>
    <circle cx="318" cy="345" r="4" fill="#3DDC84" class="pulse"/>
    <text x="330" y="350" class="sans n-title">decider: two yes/no questions</text>
    <text x="316" y="378" class="mono n-sub">1. full output still needed?</text>
    <text x="316" y="398" class="mono n-sub">2. a short excerpt still useful?</text>
    <text x="316" y="426" class="mono n-hl">act only if P(needed) &lt; 0.2</text>

    <path class="flow" d="M782 340 C820 340 830 328 866 328" marker-end="url(#arrow)"/>
    <path class="flow-amber" d="M782 382 H866" marker-end="url(#arrowAmber)"/>
    <path class="flow-grey" d="M782 424 C820 424 830 436 866 436" marker-end="url(#arrowGrey)"/>

    <rect x="870" y="306" width="290" height="44" rx="10" class="node"/>
    <text x="886" y="333" class="sans n-title">keep</text>
    <text x="932" y="333" class="sans n-hl">full output stays</text>

    <rect x="870" y="360" width="290" height="44" rx="10" class="node"/>
    <text x="886" y="387" class="sans n-title">truncate</text>
    <text x="960" y="387" class="sans n-amber">first 300 chars + pointer</text>

    <rect x="870" y="414" width="290" height="44" rx="10" class="node"/>
    <text x="886" y="441" class="sans n-title">clear</text>
    <text x="934" y="441" class="sans n-grey">pointer only, original archived</text>

    <!-- guarantees -->
    <rect x="24" y="488" width="1152" height="48" rx="12" class="node"/>
    <text x="48" y="517" class="sans n-sub"><tspan fill="#3DDC84">fail-open</tspan>: any error keeps text verbatim   ·   <tspan fill="#3DDC84">reversible</tspan>: everything removed can be restored   ·   <tspan fill="#3DDC84">audited</tspan>: every decision writes a receipt</text>
  </g>
</svg>
